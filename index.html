<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Garment Floor Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F2318" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const SIZES = ["S", "M", "L", "XL", "XXL"];
const STORE_KEY = "garment-tracker-data-v1";

const emptySizeMap = () => ({ S: 0, M: 0, L: 0, XL: 0, XXL: 0 });
const sumSizeMap = (m) => SIZES.reduce((a, s) => a + (Number(m[s]) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 10);
const money = (n) => "₹" + (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);
const startOfWeekISO = () => {
  const d = new Date();
  const day = d.getDay();
  const diff = day === 0 ? 6 : day - 1;
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0, 10);
};
const startOfMonthISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01";
};

const initialData = {
  fabricRolls: [], cuttingJobs: [], stitchIssues: [], stitchReceipts: [],
  payments: [], packagingRecords: [], sales: [],
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return initialData;
}

function GarmentTracker() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState("dashboard");

  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }, [data]);

  const update = (key, fn) => setData((d) => ({ ...d, [key]: fn(d[key]) }));

  const derived = useMemo(() => {
    const cutStock = {};
    const key = (d, s) => d + "__" + s;

    data.cuttingJobs.forEach((job) => {
      SIZES.forEach((s) => {
        const k = key(job.designName, s);
        cutStock[k] = cutStock[k] || { design: job.designName, size: s, cut: 0, issued: 0 };
        cutStock[k].cut += Number(job.cutQty[s]) || 0;
      });
    });
    data.stitchIssues.forEach((iss) => {
      SIZES.forEach((s) => {
        const k = key(iss.designName, s);
        cutStock[k] = cutStock[k] || { design: iss.designName, size: s, cut: 0, issued: 0 };
        cutStock[k].issued += Number(iss.qty[s]) || 0;
      });
    });

    const fabricCostPerDesign = {};
    data.cuttingJobs.forEach((job) => {
      const roll = data.fabricRolls.find((r) => r.id === job.rollId);
      const costPerMeter = roll ? Number(roll.costPerMeter) || 0 : 0;
      const totalPieces = sumSizeMap(job.cutQty);
      const costPerPiece = totalPieces > 0 ? (Number(job.metersUsed) * costPerMeter) / totalPieces : 0;
      const bucket = fabricCostPerDesign[job.designName] || { total: 0, count: 0 };
      bucket.total += costPerPiece; bucket.count += 1;
      fabricCostPerDesign[job.designName] = bucket;
    });
    const avgFabricCost = (design) => {
      const b = fabricCostPerDesign[design];
      return b && b.count ? b.total / b.count : 0;
    };

    const stitchedPool = {};
    data.stitchReceipts.forEach((r) => {
      SIZES.forEach((s) => {
        const k = key(r.designName, s);
        stitchedPool[k] = stitchedPool[k] || { design: r.designName, size: s, completed: 0 };
        stitchedPool[k].completed += Number(r.qty[s]) || 0;
      });
    });
    data.packagingRecords.forEach((p) => {
      const k = key(p.designName, p.size);
      stitchedPool[k] = stitchedPool[k] || { design: p.designName, size: p.size, completed: 0 };
      stitchedPool[k].packaged = (stitchedPool[k].packaged || 0) + Number(p.qty);
    });

    const stitchCostPerDesign = {};
    data.stitchReceipts.forEach((r) => {
      const bucket = stitchCostPerDesign[r.designName] || { total: 0, count: 0 };
      bucket.total += (Number(r.stitchCost) || 0) + (Number(r.trimCost) || 0);
      bucket.count += 1;
      stitchCostPerDesign[r.designName] = bucket;
    });
    const avgStitchCost = (design) => {
      const b = stitchCostPerDesign[design];
      return b && b.count ? b.total / b.count : 0;
    };

    const finishedStock = {};
    data.packagingRecords.forEach((p) => {
      const k = key(p.designName, p.size);
      finishedStock[k] = finishedStock[k] || { design: p.designName, size: p.size, qty: 0 };
      finishedStock[k].qty += Number(p.qty);
      finishedStock[k].landedCost = avgFabricCost(p.designName) + avgStitchCost(p.designName);
    });
    data.sales.forEach((s) => {
      const k = key(s.designName, s.size);
      if (finishedStock[k]) finishedStock[k].qty -= Number(s.qty);
    });

    const tailorLedger = {};
    data.stitchReceipts.forEach((r) => {
      const completed = sumSizeMap(r.qty);
      const rate = Number(r.stitchCost) || 0;
      const t = tailorLedger[r.tailorName] || { name: r.tailorName, pieces: 0, payable: 0, paid: 0 };
      t.pieces += completed; t.payable += completed * rate;
      tailorLedger[r.tailorName] = t;
    });
    data.payments.forEach((p) => {
      const t = tailorLedger[p.tailorName] || { name: p.tailorName, pieces: 0, payable: 0, paid: 0 };
      t.paid += Number(p.amount) || 0;
      tailorLedger[p.tailorName] = t;
    });

    const salesByDesign = {};
    data.sales.forEach((s) => {
      const revenue = Number(s.qty) * Number(s.price);
      const unitCost = avgFabricCost(s.designName) + avgStitchCost(s.designName);
      const totalCost = unitCost * Number(s.qty);
      const bucket = salesByDesign[s.designName] || { design: s.designName, qty: 0, revenue: 0, cost: 0 };
      bucket.qty += Number(s.qty); bucket.revenue += revenue; bucket.cost += totalCost;
      salesByDesign[s.designName] = bucket;
    });

    const totalFabricRemaining = data.fabricRolls.reduce((a, r) => a + (Number(r.remainingMeters) || 0), 0);
    const wipCutting = Object.values(cutStock).reduce((a, c) => a + Math.max(c.cut - c.issued, 0), 0);
    const wipStitching = Object.values(stitchedPool).reduce((a, c) => a + Math.max((c.completed || 0) - (c.packaged || 0), 0), 0);
    const finishedBySize = SIZES.reduce((acc, s) => {
      acc[s] = Object.values(finishedStock).filter((f) => f.size === s).reduce((a, f) => a + Math.max(f.qty, 0), 0);
      return acc;
    }, {});

    const todayStr = todayISO();
    const thisMonth = todayStr.slice(0, 7);
    let salesToday = 0, profitToday = 0, salesMonth = 0, profitMonth = 0;
    data.sales.forEach((s) => {
      const revenue = Number(s.qty) * Number(s.price);
      const unitCost = avgFabricCost(s.designName) + avgStitchCost(s.designName);
      const profit = revenue - unitCost * Number(s.qty);
      if (s.date === todayStr) { salesToday += revenue; profitToday += profit; }
      if ((s.date || "").slice(0, 7) === thisMonth) { salesMonth += revenue; profitMonth += profit; }
    });

    return {
      cutStock: Object.values(cutStock), stitchedPool: Object.values(stitchedPool),
      finishedStock: Object.values(finishedStock), tailorLedger: Object.values(tailorLedger),
      salesByDesign: Object.values(salesByDesign), totalFabricRemaining, wipCutting, wipStitching,
      finishedBySize, salesToday, profitToday, salesMonth, profitMonth, avgFabricCost, avgStitchCost,
    };
  }, [data]);

  const TABS = [
    { id: "dashboard", label: "Dashboard", icon: "📊" },
    { id: "fabric", label: "Fabric", icon: "🧵" },
    { id: "cutting", label: "Cutting", icon: "✂️" },
    { id: "stitching", label: "Stitching", icon: "👕" },
    { id: "finished", label: "Finished", icon: "📦" },
    { id: "sales", label: "Sales", icon: "🛍️" },
    { id: "export", label: "Export", icon: "⬇️" },
  ];

  return (
    <div className="min-h-screen bg-[#F5F3EE] text-[#1F2318] font-sans pb-20">
      <header className="bg-[#1F2318] text-[#F5F3EE] px-4 py-4 sticky top-0 z-20 shadow-md">
        <h1 className="text-lg font-bold tracking-tight flex items-center gap-2">
          <span className="text-[#C99A3B]">👕</span> Garment Floor Tracker
        </h1>
      </header>
      <main className="max-w-3xl mx-auto p-3">
        {tab === "dashboard" && <Dashboard derived={derived} setTab={setTab} />}
        {tab === "fabric" && <FabricPage data={data} update={update} />}
        {tab === "cutting" && <CuttingPage data={data} update={update} derived={derived} />}
        {tab === "stitching" && <StitchingPage data={data} update={update} derived={derived} />}
        {tab === "finished" && <FinishedPage data={data} update={update} derived={derived} />}
        {tab === "sales" && <SalesPage data={data} update={update} derived={derived} />}
        {tab === "export" && <ExportPage data={data} derived={derived} />}
      </main>
      <nav className="fixed bottom-0 left-0 right-0 bg-[#1F2318] border-t border-black/20 flex justify-around py-1.5 z-20">
        {TABS.map(({ id, label, icon }) => (
          <button key={id} onClick={() => setTab(id)}
            className={"flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-medium " + (tab === id ? "text-[#C99A3B]" : "text-[#F5F3EE]/50")}>
            <span className="text-base leading-none">{icon}</span>{label}
          </button>
        ))}
      </nav>
    </div>
  );
}

function Section({ title, children, right }) {
  return (
    <div className="mb-4">
      <div className="flex items-center justify-between mb-2">
        <h2 className="text-sm font-bold uppercase tracking-wide text-[#1F2318]/70">{title}</h2>
        {right}
      </div>
      {children}
    </div>
  );
}
function Card({ children, className }) {
  return <div className={"bg-white rounded-xl border border-black/5 shadow-sm p-3 " + (className || "")}>{children}</div>;
}
function Field({ label, children }) {
  return (
    <label className="block mb-2">
      <span className="block text-xs font-medium text-[#1F2318]/60 mb-1">{label}</span>
      {children}
    </label>
  );
}
const inputCls = "w-full rounded-lg border border-black/10 px-3 py-2 text-sm bg-[#FAFAF7] focus:outline-none focus:ring-2 focus:ring-[#C99A3B]";
function TextInput(props) { return <input {...props} className={inputCls} />; }
function SelectInput({ children, ...props }) { return <select {...props} className={inputCls}>{children}</select>; }
function SizeGrid({ value, onChange }) {
  return (
    <div className="grid grid-cols-5 gap-1.5">
      {SIZES.map((s) => (
        <label key={s} className="text-center">
          <span className="block text-[10px] font-semibold text-[#1F2318]/50 mb-0.5">{s}</span>
          <input type="number" min="0" value={value[s] || ""} onChange={(e) => onChange({ ...value, [s]: e.target.value })}
            className="w-full rounded-md border border-black/10 px-1 py-1.5 text-sm text-center bg-[#FAFAF7]" />
        </label>
      ))}
    </div>
  );
}
function AddButton({ onClick, label }) {
  return (
    <button onClick={onClick} className="flex items-center gap-1 bg-[#1F2318] text-[#F5F3EE] text-xs font-semibold px-3 py-1.5 rounded-lg">
      + {label || "Add"}
    </button>
  );
}
function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 z-30 flex items-end sm:items-center justify-center">
      <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md max-h-[85vh] overflow-y-auto p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-sm">{title}</h3>
          <button onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function EmptyState({ text }) { return <div className="text-center text-sm text-[#1F2318]/40 py-8">{text}</div>; }

function Dashboard({ derived, setTab }) {
  const stat = (label, value, warn) => (
    <Card className="flex-1 min-w-[140px]">
      <div className="text-[10px] uppercase font-semibold text-[#1F2318]/40">{label}</div>
      <div className={"text-xl font-bold mt-1 " + (warn ? "text-red-600" : "")}>{value}</div>
    </Card>
  );
  return (
    <div>
      <Section title="Key Metrics">
        <div className="flex flex-wrap gap-2 mb-2">
          {stat("Raw Fabric Stock", derived.totalFabricRemaining.toFixed(1) + " m")}
          {stat("WIP: Cutting → Stitching", derived.wipCutting)}
          {stat("WIP: In Stitching", derived.wipStitching)}
          {stat("Sales Today", money(derived.salesToday))}
        </div>
        <div className="flex flex-wrap gap-2">
          {stat("Profit Today", money(derived.profitToday))}
          {stat("Sales This Month", money(derived.salesMonth))}
          {stat("Profit This Month", money(derived.profitMonth))}
        </div>
      </Section>
      <Section title="Finished Stock by Size">
        <Card>
          <div className="grid grid-cols-5 gap-2 text-center">
            {SIZES.map((s) => (
              <div key={s}>
                <div className="text-[10px] text-[#1F2318]/40 font-semibold">{s}</div>
                <div className="text-lg font-bold">{derived.finishedBySize[s]}</div>
              </div>
            ))}
          </div>
        </Card>
      </Section>
      <Section title="Quick Actions">
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setTab("fabric")} className="bg-white border border-black/10 rounded-xl p-3 text-left text-sm font-semibold">+ Receive Fabric</button>
          <button onClick={() => setTab("cutting")} className="bg-white border border-black/10 rounded-xl p-3 text-left text-sm font-semibold">+ Record Cutting</button>
          <button onClick={() => setTab("stitching")} className="bg-white border border-black/10 rounded-xl p-3 text-left text-sm font-semibold">+ Issue to Stitching</button>
          <button onClick={() => setTab("sales")} className="bg-white border border-black/10 rounded-xl p-3 text-left text-sm font-semibold">+ Record Sale</button>
        </div>
      </Section>
    </div>
  );
}

function FabricPage({ data, update }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ name: "", code: "", vendor: "", meters: "", cost: "", date: todayISO(), notes: "" });
  const save = () => {
    if (!form.name || !form.meters) return;
    update("fabricRolls", (rolls) => [...rolls, {
      id: uid(), name: form.name, code: form.code || ("ROLL-" + (rolls.length + 1)), vendor: form.vendor,
      totalMeters: Number(form.meters), remainingMeters: Number(form.meters), costPerMeter: Number(form.cost) || 0,
      receivedDate: form.date, notes: form.notes,
    }]);
    setForm({ name: "", code: "", vendor: "", meters: "", cost: "", date: todayISO(), notes: "" });
    setOpen(false);
  };
  return (
    <div>
      <Section title="Raw Fabric Stock" right={<AddButton onClick={() => setOpen(true)} label="Receive Fabric" />}>
        {data.fabricRolls.length === 0 ? <EmptyState text="No fabric received yet. Tap 'Receive Fabric' to log your first roll." /> : (
          <div className="space-y-2">
            {data.fabricRolls.map((r) => (
              <Card key={r.id}>
                <div className="flex justify-between items-start">
                  <div>
                    <div className="font-semibold text-sm">{r.name}</div>
                    <div className="text-xs text-[#1F2318]/50">{r.code} · {r.vendor}</div>
                  </div>
                  {r.remainingMeters <= 0 && <span className="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-semibold">EXHAUSTED</span>}
                </div>
                <div className="grid grid-cols-3 gap-2 mt-2 text-xs">
                  <div><div className="text-[#1F2318]/40">Remaining</div><div className="font-bold">{r.remainingMeters} m</div></div>
                  <div><div className="text-[#1F2318]/40">Cost/m</div><div className="font-bold">{money(r.costPerMeter)}</div></div>
                  <div><div className="text-[#1F2318]/40">Value</div><div className="font-bold">{money(r.remainingMeters * r.costPerMeter)}</div></div>
                </div>
              </Card>
            ))}
          </div>
        )}
      </Section>
      {open && (
        <Modal title="Receive Fabric Roll" onClose={() => setOpen(false)}>
          <Field label="Fabric Type/Name"><TextInput value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Cotton Twill Navy" /></Field>
          <Field label="Roll ID / Code"><TextInput value={form.code} onChange={(e) => setForm({ ...form, code: e.target.value })} placeholder="Optional, auto-generated if blank" /></Field>
          <Field label="Vendor Name"><TextInput value={form.vendor} onChange={(e) => setForm({ ...form, vendor: e.target.value })} /></Field>
          <Field label="Total Meters Received"><TextInput type="number" value={form.meters} onChange={(e) => setForm({ ...form, meters: e.target.value })} /></Field>
          <Field label="Cost per Meter"><TextInput type="number" value={form.cost} onChange={(e) => setForm({ ...form, cost: e.target.value })} /></Field>
          <Field label="Received Date"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="Remarks/Notes"><TextInput value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
          <button onClick={save} className="w-full bg-[#1F2318] text-[#F5F3EE] font-semibold py-2.5 rounded-lg mt-2">Save Roll</button>
        </Modal>
      )}
    </div>
  );
}

function CuttingPage({ data, update, derived }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ rollId: "", meters: "", design: "", qty: emptySizeMap() });
  const save = () => {
    if (!form.rollId || !form.design || !form.meters) return;
    update("cuttingJobs", (jobs) => [...jobs, { id: uid(), rollId: form.rollId, metersUsed: Number(form.meters), designName: form.design, cutQty: form.qty, date: todayISO() }]);
    update("fabricRolls", (rolls) => rolls.map((r) => r.id === form.rollId ? { ...r, remainingMeters: Math.max(r.remainingMeters - Number(form.meters), 0) } : r));
    setForm({ rollId: "", meters: "", design: "", qty: emptySizeMap() });
    setOpen(false);
  };
  const totalPieces = sumSizeMap(form.qty);
  const yieldPerPiece = totalPieces > 0 && form.meters ? (Number(form.meters) / totalPieces).toFixed(3) : "-";
  return (
    <div>
      <Section title="Cut Pieces Stock (Unstitched)" right={<AddButton onClick={() => setOpen(true)} label="Log Cutting" />}>
        {derived.cutStock.filter((c) => c.cut > 0).length === 0 ? <EmptyState text="No cutting jobs logged yet." /> : (
          <div className="space-y-1.5">
            {derived.cutStock.filter((c) => c.cut > 0).map((c, i) => (
              <Card key={i} className="flex justify-between items-center">
                <div>
                  <div className="font-semibold text-sm">{c.design}</div>
                  <div className="text-xs text-[#1F2318]/50">Size {c.size} · Fabric cost/pc {money(derived.avgFabricCost(c.design))}</div>
                </div>
                <div className="text-right">
                  <div className="font-bold">{Math.max(c.cut - c.issued, 0)}</div>
                  <div className="text-[10px] text-[#1F2318]/40">available</div>
                </div>
              </Card>
            ))}
          </div>
        )}
      </Section>
      {open && (
        <Modal title="Log Cutting Job" onClose={() => setOpen(false)}>
          <Field label="Select Raw Fabric Roll">
            <SelectInput value={form.rollId} onChange={(e) => setForm({ ...form, rollId: e.target.value })}>
              <option value="">Choose roll…</option>
              {data.fabricRolls.filter((r) => r.remainingMeters > 0).map((r) => (
                <option key={r.id} value={r.id}>{r.name} ({r.code}) — {r.remainingMeters}m left</option>
              ))}
            </SelectInput>
          </Field>
          <Field label="Meters Used from Roll"><TextInput type="number" value={form.meters} onChange={(e) => setForm({ ...form, meters: e.target.value })} /></Field>
          <Field label="Design/Style Name"><TextInput value={form.design} onChange={(e) => setForm({ ...form, design: e.target.value })} placeholder="Men's Cotton Shirt - Navy" /></Field>
          <Field label="Cut Quantity Output by Size"><SizeGrid value={form.qty} onChange={(v) => setForm({ ...form, qty: v })} /></Field>
          <div className="text-xs text-[#1F2318]/50 mb-2">Yield: {yieldPerPiece} m/piece · {totalPieces} pieces total</div>
          <button onClick={save} className="w-full bg-[#1F2318] text-[#F5F3EE] font-semibold py-2.5 rounded-lg mt-1">Save Cutting Job</button>
        </Modal>
      )}
    </div>
  );
}

function StitchingPage({ data, update, derived }) {
  const [subTab, setSubTab] = useState("issue");
  const [issueOpen, setIssueOpen] = useState(false);
  const [receiveOpen, setReceiveOpen] = useState(false);
  const [payOpen, setPayOpen] = useState(false);
  const [issueForm, setIssueForm] = useState({ tailor: "", design: "", qty: emptySizeMap(), date: todayISO() });
  const [recvForm, setRecvForm] = useState({ tailor: "", design: "", qty: emptySizeMap(), rejected: "", stitchCost: "", trimCost: "" });
  const [payForm, setPayForm] = useState({ tailor: "", amount: "" });
  const availableDesigns = derived.cutStock.filter((c) => c.cut - c.issued > 0);

  const saveIssue = () => {
    if (!issueForm.tailor || !issueForm.design) return;
    update("stitchIssues", (arr) => [...arr, { id: uid(), tailorName: issueForm.tailor, designName: issueForm.design, qty: issueForm.qty, promisedDate: issueForm.date }]);
    setIssueForm({ tailor: "", design: "", qty: emptySizeMap(), date: todayISO() });
    setIssueOpen(false);
  };
  const saveReceive = () => {
    if (!recvForm.tailor || !recvForm.design) return;
    update("stitchReceipts", (arr) => [...arr, { id: uid(), tailorName: recvForm.tailor, designName: recvForm.design, qty: recvForm.qty, rejected: Number(recvForm.rejected) || 0, stitchCost: Number(recvForm.stitchCost) || 0, trimCost: Number(recvForm.trimCost) || 0, date: todayISO() }]);
    setRecvForm({ tailor: "", design: "", qty: emptySizeMap(), rejected: "", stitchCost: "", trimCost: "" });
    setReceiveOpen(false);
  };
  const savePayment = () => {
    if (!payForm.tailor || !payForm.amount) return;

function buildInventoryWorkbook(data, derived, startDate, endDate) {
  const inRange = (d) => (!d ? false : (!startDate || d >= startDate) && (!endDate || d <= endDate));
  const wb = XLSX.utils.book_new();

  const rolls = data.fabricRolls.filter((r) => inRange(r.receivedDate));
  const rollsSheet = rolls.map((r) => ({
    "Roll ID": r.code, "Fabric Name": r.name, "Vendor": r.vendor, "Received Date": r.receivedDate,
    "Total Meters": r.totalMeters, "Remaining Meters": r.remainingMeters,
    "Cost/Meter": r.costPerMeter, "Total Value": +(r.remainingMeters * r.costPerMeter).toFixed(2), "Notes": r.notes || "",
  }));

  const cutting = data.cuttingJobs.filter((j) => inRange(j.date));
  const cuttingSheet = cutting.map((j) => {
    const roll = data.fabricRolls.find((r) => r.id === j.rollId);
    return {
      "Date": j.date, "Design": j.designName, "Roll Used": roll ? roll.code : "",
      "Meters Used": j.metersUsed, "S": j.cutQty.S || 0, "M": j.cutQty.M || 0, "L": j.cutQty.L || 0,
      "XL": j.cutQty.XL || 0, "XXL": j.cutQty.XXL || 0, "Total Pieces Cut": sumSizeMap(j.cutQty),
    };
  });

  const stitchIssued = data.stitchIssues.filter((i) => inRange(i.promisedDate));
  const stitchIssuedSheet = stitchIssued.map((i) => ({
    "Design": i.designName, "Tailor": i.tailorName, "Promised Date": i.promisedDate,
    "S": i.qty.S || 0, "M": i.qty.M || 0, "L": i.qty.L || 0, "XL": i.qty.XL || 0, "XXL": i.qty.XXL || 0,
    "Total Issued": sumSizeMap(i.qty),
  }));

  const stitchReceived = data.stitchReceipts.filter((r) => inRange(r.date));
  const stitchReceivedSheet = stitchReceived.map((r) => ({
    "Date": r.date, "Design": r.designName, "Tailor": r.tailorName,
    "S": r.qty.S || 0, "M": r.qty.M || 0, "L": r.qty.L || 0, "XL": r.qty.XL || 0, "XXL": r.qty.XXL || 0,
    "Total Completed": sumSizeMap(r.qty), "Rejected": r.rejected || 0,
    "Stitch Cost/Pc": r.stitchCost, "Trim Cost/Pc": r.trimCost,
  }));

  const packaging = data.packagingRecords.filter((p) => inRange(p.date));
  const packagingSheet = packaging.map((p) => ({
    "Date": p.date, "Design": p.designName, "Size": p.size, "Packaging Type": p.packagingType,
    "Tag/Barcode": p.tagId, "Quantity": p.qty,
  }));

  const sales = data.sales.filter((s) => inRange(s.date));
  const salesSheet = sales.map((s) => ({
    "Date": s.date, "Design": s.designName, "Size": s.size, "Customer": s.customer || "",
    "Channel": s.channel, "Qty Sold": s.qty, "Price/Unit": s.price, "Revenue": +(s.qty * s.price).toFixed(2),
    "Payment Status": s.paymentStatus, "Payment Mode": s.paymentMode,
  }));

  const payments = data.payments.filter((p) => inRange(p.date));
  const paymentsSheet = payments.map((p) => ({ "Date": p.date, "Tailor": p.tailorName, "Amount Paid": p.amount }));

  const pendingCutting = derived.cutStock.filter((c) => c.cut - c.issued > 0).map((c) => ({
    "Design": c.design, "Size": c.size, "Cut Pieces Available (not yet issued)": c.cut - c.issued,
  }));
  const pendingStitching = derived.stitchedPool.filter((s) => (s.completed || 0) - (s.packaged || 0) > 0).map((s) => ({
    "Design": s.design, "Size": s.size, "Completed, Not Yet Packaged": (s.completed || 0) - (s.packaged || 0),
  }));
  const finishedStockSheet = derived.finishedStock.filter((f) => f.qty > 0).map((f) => ({
    "Design": f.design, "Size": f.size, "Finished Stock (unsold)": f.qty, "Landed Cost/Pc": +f.landedCost.toFixed(2),
  }));

  const totalRevenue = sales.reduce((a, s) => a + s.qty * s.price, 0);
  const totalCOGS = sales.reduce((a, s) => a + (derived.avgFabricCost(s.designName) + derived.avgStitchCost(s.designName)) * s.qty, 0);
  const summarySheet = [
    { "Metric": "Period", "Value": (startDate || "All time") + " to " + (endDate || "today") },
    { "Metric": "Fabric Rolls Received", "Value": rolls.length },
    { "Metric": "Total Meters Received", "Value": rolls.reduce((a, r) => a + Number(r.totalMeters), 0) },
    { "Metric": "Cutting Jobs Logged", "Value": cutting.length },
    { "Metric": "Total Pieces Cut", "Value": cutting.reduce((a, j) => a + sumSizeMap(j.cutQty), 0) },
    { "Metric": "Pieces Issued to Stitching", "Value": stitchIssued.reduce((a, i) => a + sumSizeMap(i.qty), 0) },
    { "Metric": "Pieces Completed by Stitching", "Value": stitchReceived.reduce((a, r) => a + sumSizeMap(r.qty), 0) },
    { "Metric": "Pieces Rejected/Damaged", "Value": stitchReceived.reduce((a, r) => a + (Number(r.rejected) || 0), 0) },
    { "Metric": "Pieces Packaged", "Value": packaging.reduce((a, p) => a + Number(p.qty), 0) },
    { "Metric": "Pieces Sold", "Value": sales.reduce((a, s) => a + Number(s.qty), 0) },
    { "Metric": "Total Revenue", "Value": +totalRevenue.toFixed(2) },
    { "Metric": "Total Production Cost (COGS)", "Value": +totalCOGS.toFixed(2) },
    { "Metric": "Net Profit", "Value": +(totalRevenue - totalCOGS).toFixed(2) },
    { "Metric": "-- Current pending (not date filtered) --", "Value": "" },
    { "Metric": "Pending in Cutting -> Stitching (cut, not issued)", "Value": pendingCutting.reduce((a, c) => a + c["Cut Pieces Available (not yet issued)"], 0) },
    { "Metric": "Pending in Stitching -> Packaging", "Value": pendingStitching.reduce((a, c) => a + c["Completed, Not Yet Packaged"], 0) },
    { "Metric": "Current Finished Stock (ready to sell)", "Value": finishedStockSheet.reduce((a, f) => a + f["Finished Stock (unsold)"], 0) },
  ];

  const addSheet = (rows, name) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "No data": "No records in this period" }]);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };

  addSheet(summarySheet, "Summary");
  addSheet(rollsSheet, "Fabric Rolls");
  addSheet(cuttingSheet, "Cutting");
  addSheet(stitchIssuedSheet, "Stitching Issued");
  addSheet(stitchReceivedSheet, "Stitching Received");
  addSheet(packagingSheet, "Packaging");
  addSheet(salesSheet, "Sales");
  addSheet(paymentsSheet, "Tailor Payments");
  addSheet(pendingCutting, "Pending - Cutting");
  addSheet(pendingStitching, "Pending - Stitching");
  addSheet(finishedStockSheet, "Finished Stock");

  return wb;
}

function ExportPage({ data, derived }) {
  const [preset, setPreset] = useState("month");
  const [startDate, setStartDate] = useState(startOfMonthISO());
  const [endDate, setEndDate] = useState(todayISO());

  const applyPreset = (p) => {
    setPreset(p);
    if (p === "week") { setStartDate(startOfWeekISO()); setEndDate(todayISO()); }
    if (p === "month") { setStartDate(startOfMonthISO()); setEndDate(todayISO()); }
    if (p === "all") { setStartDate(""); setEndDate(""); }
  };

  const download = () => {
    const wb = buildInventoryWorkbook(data, derived, startDate, endDate);
    const label = !startDate && !endDate ? "AllTime" : (startDate || "start") + "_to_" + (endDate || "today");
    XLSX.writeFile(wb, "Garment_Inventory_" + label + ".xlsx");
  };

  return (
    <div>
      <Section title="Export Inventory Report">
        <Card>
          <div className="text-xs text-[#1F2318]/60 mb-3">
            Exports a full Excel workbook: fabric rolls, cutting, stitching, packaging, sales, tailor
            payments, plus pending stock at every stage and a summary. Flow sheets are filtered to the
            date range below; current pending/finished stock is always the live snapshot.
          </div>
          <div className="flex gap-1.5 mb-3 flex-wrap">
            {[["week", "This Week"], ["month", "This Month"], ["all", "All Time"], ["custom", "Custom"]].map(([id, label]) => (
              <button key={id} onClick={() => applyPreset(id)}
                className={"text-xs font-semibold px-2.5 py-1.5 rounded-full " + (preset === id ? "bg-[#1F2318] text-white" : "bg-[#FAFAF7] border border-black/10")}>
                {label}
              </button>
            ))}
          </div>
          {preset === "custom" && (
            <div className="grid grid-cols-2 gap-2 mb-3">
              <Field label="From"><TextInput type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} /></Field>
              <Field label="To"><TextInput type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} /></Field>
            </div>
          )}
          {preset !== "custom" && preset !== "all" && <div className="text-xs text-[#1F2318]/50 mb-3">{startDate} to {endDate}</div>}
          {preset === "all" && <div className="text-xs text-[#1F2318]/50 mb-3">Every record, no date filter</div>}
          <button onClick={download} className="w-full bg-[#1F2318] text-[#F5F3EE] font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2">
            ⬇️ Download Excel Report
          </button>
        </Card>
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GarmentTracker />);
</script>
</body>
</html>
